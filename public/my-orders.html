<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My orders – Subhash Departmental Store</title>
  <meta name="description" content="See your past orders and reorder in one tap.">
  <meta name="theme-color" content="#F55D2C">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Subhash Departmental Store">
  <meta property="og:title" content="My orders – Subhash Departmental Store">
  <meta property="og:description" content="See your past orders and reorder in one tap.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/store.css" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
</head>
<body data-page="orders">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head"><h1>My orders</h1>
      <p class="text-muted mb-0">Enter your mobile number and any one of your order numbers (it's on your order confirmation).</p></div>
    <form class="form-card row g-2 mt-3 mx-0" style="max-width:640px" data-orders-form novalidate>
      <div class="col-sm-5"><div class="input-group"><span class="input-group-text">+91</span>
        <input class="form-control" name="phone" required inputmode="numeric" maxlength="10" placeholder="Mobile number" aria-label="Mobile number"></div></div>
      <div class="col-sm-4"><input class="form-control" name="order_no" required maxlength="12" placeholder="Order no. e.g. SDS7K2M9Q" aria-label="Order number" style="text-transform:uppercase"></div>
      <div class="col-sm-3 d-grid"><button class="btn btn-brand" type="submit">Show orders</button></div>
    </form>
    <div data-orders class="mb-4"></div>
  </main>

  <div id="site-footer"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script defer src="/js/config.js"></script>
  <script defer src="/js/utils.js"></script>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/art.js"></script>
  <script defer src="/js/cart.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/pages/my-orders.js"></script>
</body>
</html>
