# =====================================================================
# wrangler.toml — Cloudflare settings for this project
# ---------------------------------------------------------------------
# This file holds NO secrets (IDs here are safe to commit).
# Secrets go in .dev.vars (local) and "npx wrangler secret put" (live).
# =====================================================================

name = "subhash-store"                 # Cloudflare Pages project name
pages_build_output_dir = "public"      # the folder that becomes the website
compatibility_date = "2025-10-01"

# ---- D1 database ----------------------------------------------------
# "binding" is how the code reaches it: env.DB
# Replace database_id with YOUR id (README → "Create the database").
# For local testing any value works, so the placeholder is fine.
[[d1_databases]]
binding = "DB"
database_name = "subhash-store-db"
database_id = "REPLACE-WITH-YOUR-D1-DATABASE-ID"
migrations_dir = "migrations"
